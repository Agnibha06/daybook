name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: daybook-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk daybook.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest daybook.apk \
            --title "Daybook (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone, download daybook.apk and open it to install or update." \
            --latest
